[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
auto_detect_solc = true
evm_version = "cancun"
optimizer = true
optimizer_runs = 50 # TidewellVaultV4 must stay under the 24,576-byte contract size limit
via_ir = true
fs_permissions = [{ access = "read", path = "./uniswap-artifacts" }, { access = "read", path = "./out" }, { access = "read-write", path = "../deployments" }]
remappings = [
  "@openzeppelin/=lib/openzeppelin-contracts/",
  "forge-std/=lib/forge-std/src/",
  "@uniswap/v4-core/=lib/v4-periphery/lib/v4-core/",
  "v4-periphery/=lib/v4-periphery/",
  "permit2/=lib/v4-periphery/lib/permit2/",
  "solmate/=lib/solmate/",
  "openzeppelin-contracts/=lib/openzeppelin-contracts/",
]

[fmt]
line_length = 120
